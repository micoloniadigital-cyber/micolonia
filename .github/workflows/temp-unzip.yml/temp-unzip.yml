name: Temp Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip package into mi-colonia-digital
        run: |
          rm -rf mi-colonia-digital
          unzip -o mi-colonia-digital-proyecto__2.zip
          rm -f mi-colonia-digital-proyecto__2.zip
      - name: Commit and push
        run: |
          git config user.name "micoloniadigital-cyber"
          git config user.email "micoloniadigital-cyber@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publica el texto nuevo de registro y el horario por día (checklist)" || echo "No changes to commit"
          git push
