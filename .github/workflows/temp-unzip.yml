name: Temp Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Descomprimir ZIP en la raíz
        run: |
          rm -rf mi-colonia-digital/
          unzip -o mi-colonia-digital-proyecto.zip
      - name: Publicar archivos descomprimidos
        run: |
          git config user.name "micoloniadigital-cyber"
          git config user.email "micoloniadigital-cyber@users.noreply.github.com"
          git add -A
          git commit -m "Publica botón entrar como negocio" || echo "Sin cambios para publicar"
          git push
