name: temp-unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project into mi-colonia-digital
        run: |
          rm -rf mi-colonia-digital
          unzip -o mi-colonia-digital-proyecto__3.zip
          rm -f mi-colonia-digital-proyecto__3.zip
          ls mi-colonia-digital | head -20
      - name: Commit unpacked project
        run: |
          git config user.name "micoloniadigital-cyber"
          git config user.email "micoloniadigital-cyber@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "no changes" || git commit -m 'Publica contador de visitas, login popup, panel admin y encabezado con sesión'
          git push
