name: Temp Unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir ZIP en la raiz
        run: |
          rm -rf mi-colonia-digital
          unzip -o mi-colonia-digital-proyecto__5.zip
          ls -la
      - name: Publicar archivos descomprimidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publica arreglo de hora, destacados a 10 y contador en el inicio" || echo "Sin cambios para publicar"
          git push
