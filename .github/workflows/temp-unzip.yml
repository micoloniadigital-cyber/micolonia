name: temp-unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el ZIP en la raiz
        run: |
          rm -rf mi-colonia-digital
          unzip -o mi-colonia-digital-proyecto__4.zip
      - name: Publicar los archivos descomprimidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Descomprime el arreglo de subida de fotos" || echo "Sin cambios para confirmar"
          git push
