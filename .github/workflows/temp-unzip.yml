name: temp-unzip

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Descomprimir ZIP en la raíz
        run: |
          rm -rf mi-colonia-digital
          unzip -o mi-colonia-digital-proyecto__6.zip
      - name: Publicar archivos extraídos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publica citas para negocios de belleza" || echo "Sin cambios para publicar"
          git push
