name: Descomprimir paquete de producción

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  descomprimir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir el paquete en mi-colonia-digital
        run: |
          unzip -o mi-colonia-digital-proyecto__1.zip
          rm mi-colonia-digital-proyecto__1.zip
      - name: Publicar los cambios en main
        run: |
          git config user.name "micoloniadigital-cyber"
          git config user.email "micoloniadigital-cyber@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publica el diseño completo del demo (paquete de producción)" || echo "Sin cambios para confirmar"
          git push
